services:
  app:
    build: .
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mobi_companies
      DB_USERNAME: postgres
      DB_PASSWORD: secret

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mobi_companies
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobi_companies"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
