services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Host :8001 — tránh xung đột php artisan serve cũ trên :8000 (limit 2M/8M)
      - "8001:8000"
    volumes:
      - .:/var/www
    env_file: .env
    environment:
      REDIS_HOST: redis
      SOCKET_INTERNAL_URL: http://socket:3001
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-520}
    networks:
      - default
      - mobi-net

  queue:
    build: .
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file: .env
    environment:
      REDIS_HOST: redis
      SOCKET_INTERNAL_URL: http://socket:3001
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-520}
    command: ["/usr/local/bin/entrypoint-queue.sh"]
    depends_on:
      - app
    networks:
      - default
      - mobi-net

networks:
  mobi-net:
    external: true
    name: mobi-net
