services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    env_file: .env

  queue:
    build: .
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file: .env
    command: ["/usr/local/bin/entrypoint-queue.sh"]
    depends_on:
      - app
