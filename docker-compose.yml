services:
  app:
    build: .
    ports:
      - "8000:8000"
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
      php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mobi_companies
      DB_USERNAME: mobi_companies
      DB_PASSWORD: mobi_companies@2026

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mobi_companies
      POSTGRES_USER: mobi_companies
      POSTGRES_PASSWORD: mobi_companies@2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobi_companies -d mobi_companies"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
