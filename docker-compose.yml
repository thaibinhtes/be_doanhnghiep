services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    env_file: .env
    environment:
      REDIS_HOST: redis
      SOCKET_INTERNAL_URL: http://socket:3001
    networks:
      - default
      - mobi-net

  queue:
    build: .
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file: .env
    environment:
      REDIS_HOST: redis
      SOCKET_INTERNAL_URL: http://socket:3001
    command: ["/usr/local/bin/entrypoint-queue.sh"]
    depends_on:
      - app
    networks:
      - default
      - mobi-net

networks:
  mobi-net:
    external: true
    name: mobi-net
